name: CI
on:
  push:
    branches: ["main"]
  pull_request:
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@41dfa10bad2bb2ae585af6ee5bb4d7d973ad74ed # v5.1.0
        with:
          go-version: "1.22"
      # Tests self-skip without INTENTUMDIFF_CORE_LIB; Phase D wires the engine artifact.
      # -unsafeptr=false: the Windows loader converts ONE engine-returned foreign heap
      # uintptr to a Pointer (documented in loader_windows.go); vet's heuristic flags it.
      - run: go vet -unsafeptr=false ./... && go build ./... && go test ./...
